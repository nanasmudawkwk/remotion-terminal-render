name: Remotion Video Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    name: Render Video via Remotion

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Ensure Remotion Browser
        run: npx remotion browser ensure

      - name: Detect entry and render
        run: |
          mkdir -p out
          ENTRY="src/index.ts"
          if [ -f "src/index.ts" ]; then ENTRY="src/index.ts";
          elif [ -f "src/index.tsx" ]; then ENTRY="src/index.tsx";
          elif [ -f "src/index.js" ]; then ENTRY="src/index.js";
          elif [ -f "src/index.jsx" ]; then ENTRY="src/index.jsx";
          elif [ -f "index.ts" ]; then ENTRY="index.ts";
          elif [ -f "index.tsx" ]; then ENTRY="index.tsx";
          elif [ -f "index.js" ]; then ENTRY="index.js";
          fi

          COMP=""
          if [ -f ".composition_id" ]; then
            COMP=$(cat .composition_id | tr -d '\r\n ')
          fi

          if [ -z "$COMP" ]; then
            # Extract first composition from Root or default to TerminalLesson
            COMP=$(grep -o 'id="[^"]*"' src/Root.* 2>/dev/null | head -n 1 | cut -d'"' -f2 || echo "TerminalLesson")
          fi

          echo "Rendering with entry: $ENTRY, composition: $COMP"
          npx remotion render "$ENTRY" "$COMP" out/video.mp4 --concurrency=2 --gl=angle --crf=24 --pixel-format=yuv420p

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-rendered-video
          path: out/video.mp4
          retention-days: 7

      - name: Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes || true
          gh release create v1.0.0 out/video.mp4 \
            --title "Hasil Render Video: Materi Pembelajaran Dasar Terminal" \
            --notes "Video berhasil dirender menggunakan Remotion via GitHub Actions." || true
