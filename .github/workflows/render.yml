name: Remotion Video Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    name: Render Video via Remotion

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Ensure Remotion Browser
        run: npx remotion browser ensure

      - name: Render Remotion Video
        run: |
          mkdir -p out
          npx remotion render src/index.ts TerminalLesson out/video.mp4 --concurrency=2 --gl=angle

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-rendered-video
          path: out/video.mp4
          retention-days: 7

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 out/video.mp4 \
            --title "Hasil Render Video: Materi Pembelajaran Dasar Terminal" \
            --notes "Video berhasil dirender menggunakan Remotion via GitHub Actions." || true
